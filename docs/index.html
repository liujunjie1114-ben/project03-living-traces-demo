<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="icon" href="data:,"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project 03 — AFTER EXPRESSION / LIVING TRACES</title><meta name="description" content="黑底蓝白粒子光场与摩斯节奏交互装置的软件演示。在线预览、输入确认、声音与事件回看。"><link rel="stylesheet" href="style.css"><style>
body{margin:0;background:#000;overflow:hidden;color:#d6e6f2}#field{width:100vw;height:100vh}.light-header{position:absolute;top:30px;left:38px;right:38px;display:flex;justify-content:space-between;align-items:flex-start;gap:24px;pointer-events:none}.light-header h1{font:18px/1.1 var(--condensed);letter-spacing:2px;margin:0;color:#cfe5f6}.light-header p{font:10px/1.5 var(--body);letter-spacing:1px;margin:8px 0;color:#67809a}.light-header a{font:11px var(--condensed);color:#8babc6;pointer-events:auto}.light-footer{position:absolute;bottom:28px;left:38px;right:38px;display:flex;justify-content:space-between;align-items:center;gap:20px;color:#6889a8;font:10px var(--condensed);letter-spacing:1px}.light-actions{display:flex;gap:22px}.light-actions button{background:none;color:#b1cee3;font:11px var(--body);border-bottom:1px solid #4a6780;padding:5px 0}.light-error{position:absolute;top:50%;left:20%;right:20%;text-align:center;color:#c4d9e8}@media(max-width:600px){.light-header{top:22px;left:22px;right:22px}.light-header h1{font-size:14px}.light-footer{left:22px;right:22px;bottom:20px}.light-header p{font-size:9px}.light-actions{gap:14px}}
</style></head><body><canvas id="field" aria-label="蓝白光斑和流动粒子，黑色背景"></canvas><header class="light-header"><div><h1>AFTER EXPRESSION / LIVING TRACES</h1><p>BLUE / WHITE — LIGHT FIELD STUDY 02 · ONLINE DEMO</p></div><a href="studio.html">开始交互演示 ↗</a></header><footer class="light-footer"><span id="state">HELLO / 静音循环预览</span><div class="light-actions"><button id="pause">暂停</button><button id="fullscreen">全屏 ↗</button></div></footer><p id="error" class="light-error" hidden></p><script type="module">
import {RhythmField,VISUAL_VERSION} from './visual.js';import {buildPlan} from './core.js';
const field=new RhythmField(document.getElementById('field')),plan=buildPlan('HELLO',120,'ENGINEERING-PREVIEW-HELLO');let begin=performance.now(),paused=false,pauseAt=0;
document.getElementById('pause').onclick=()=>{paused=!paused;if(paused)pauseAt=performance.now();else begin+=performance.now()-pauseAt;document.getElementById('pause').textContent=paused?'继续':'暂停';};
document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen().catch(()=>{});
function frame(now){const ms=((paused?pauseAt:now)-begin)%(plan.duration_ms+1800);if(!paused)field.draw(plan,ms,ms<plan.duration_ms);document.getElementById('state').textContent=paused?'PAUSED / 已暂停':ms<plan.duration_ms?'HELLO / 静音节奏预览':'IDLE / 余光衰减';if(field.error){const e=document.getElementById('error');e.hidden=false;e.textContent=field.error;}requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.lightFieldDebug={snapshot:()=>({renderer:field.rendererName,error:field.error,frames:field.frames,particle_count:field.count,version:VISUAL_VERSION,source:'ENGINEERING_DEMO_SILENT_LOOP',audio:false})};
</script></body></html>
